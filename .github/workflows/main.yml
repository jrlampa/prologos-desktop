name: Prólogos Enterprise CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    backend-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"
            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r backend/requirements.txt
            - name: Run Backend Tests (pytest)
              run: |
                  pytest backend/tests/

    frontend-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Dependencies
              run: |
                  cd frontend
                  npm install
            - name: Run Component Tests (vitest)
              run: |
                  cd frontend
                  npm run test:unit
